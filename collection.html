<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection | Mannat Boutique and Fashion</title>
<meta name="description" content="Mannat Boutique and Fashion, Kapad Bazar, Ahmedabad. Cord sets, one pieces, tops, shirts, jeans and ladies wear. Order on WhatsApp.">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&family=Noto+Sans+Gujarati:wght@300;400;500&family=Noto+Serif+Gujarati:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="#top"><img src="logo.png" alt="Mannat logo"><span>Mannat</span></a>
    <div class="right">
      <nav><a href="index.html" data-t="n0"></a><a href="collection.html" data-t="n1"></a><a href="index.html#order" data-t="n2"></a><a href="index.html#contact" data-t="n3"></a></nav>
      <div class="lang" id="lang" role="group" aria-label="Language">
        <button data-l="en">EN</button><button data-l="gu">ગુજ</button><button data-l="hi">Hinglish</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="pagehead"><h1 data-t="ct"></h1><p data-t="cs"></p></div>
  <section id="collection"><div class="wrap">
    <div class="chips" id="chips" role="group"></div>
    <div class="grid" id="grid"></div>
    <p class="note" data-t="note"></p>
  </div></section>
</main>
<footer><img src="logo.png" alt="">© <span id="year"></span> Mannat Boutique and Fashion, Kapad Bazar, Ahmedabad</footer>
<a class="wa-float" data-wa href="#">WhatsApp</a>

<script src="config.js"></script>
<script src="starter-products.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="site.js"></script>
<script>
let cat="all",products=window.STARTER;
window.pagePaint=function(t){
  const present=ORDER.filter(k=>products.some(p=>p.category===k));
  const chips=$("chips");chips.textContent="";
  ["all",...present].forEach(k=>{
    const b=document.createElement("button");b.className="chip";
    b.textContent=k==="all"?t.all:CATS[k][IDX[lang]];
    b.setAttribute("aria-pressed",k===cat);
    b.onclick=()=>{cat=k;paint()};chips.append(b);
  });
  const grid=$("grid");grid.textContent="";
  products.filter(p=>cat==="all"||p.category===cat).forEach(p=>{
    const c=document.createElement("article");c.className="card";
    const ph=document.createElement("div");ph.className="ph";
    const im=document.createElement("img");im.src=p.image_url;im.alt=p.name;im.loading="lazy";ph.append(im);
    const info=document.createElement("div");info.className="info";
    const s=document.createElement("small");s.textContent=(CATS[p.category]||[p.category,p.category,p.category])[IDX[lang]];
    const h=document.createElement("h3");h.textContent=p.name;
    const f=document.createElement("div");f.className="fab";
    f.textContent=t.fab+": "+((FABS[p.fabric]||[p.fabric,p.fabric,p.fabric])[IDX[lang]]);
    const d=document.createElement("p");d.className="d";d.textContent=p.description||"";
    const a=document.createElement("a");a.className="ask";a.textContent=t.ask;a.href=wa(t.p(p.name));
    info.append(s,h,f,d,a);c.append(ph,info);grid.append(c);
  });
};
async function load(){
  const C=window.MANNAT||{};
  if(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&window.supabase){
    try{
      const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
      const {data,error}=await sb.from("products").select("*").order("sort").order("created_at",{ascending:false});
      if(!error&&data&&data.length)return data;
    }catch(e){}
  }
  return window.STARTER;
}
paint();
load().then(d=>{products=d;paint()});
</script>
</body>
</html>
