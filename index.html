const LANGS={en:"en",gu:"gu",hi:"hi-Latn"};
const ORDER=["cordset","shirt","onepiece","top","ladies","jeans"];
const IDX={en:0,gu:1,hi:2};
let lang=DEFAULT_LANG, cat="all", products=[];
try{const s=localStorage.getItem("mannat-lang");if(T[s])lang=s}catch(e){}
const wa=t=>`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(t)}`;
const $=id=>document.getElementById(id);

function paint(){
  const t=T[lang];
  document.documentElement.lang=LANGS[lang];
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll("[data-wa]").forEach(e=>e.href=wa(t.g));
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("mapLink").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("Mannat Boutique and Fashion Gud Gali Kapad Bazar Ahmedabad 380001");
  const present=ORDER.filter(k=>products.some(p=>p.category===k));
  $("strip").textContent=present.map(k=>CATS[k][IDX[lang]]).join("  |  ");
  const chips=$("chips"); chips.textContent="";
  ["all",...present].forEach(k=>{
    const b=document.createElement("button"); b.className="chip";
    b.textContent=k==="all"?t.all:CATS[k][IDX[lang]];
    b.setAttribute("aria-pressed",k===cat);
    b.onclick=()=>{cat=k;paint()};
    chips.append(b);
  });
  const grid=$("grid"); grid.textContent="";
  products.filter(p=>cat==="all"||p.category===cat).forEach(p=>{
    const c=document.createElement("article"); c.className="card";
    const ph=document.createElement("div"); ph.className="ph";
    const im=document.createElement("img"); im.src=p.image_url; im.alt=p.name; im.loading="lazy"; ph.append(im);
    const info=document.createElement("div"); info.className="info";
    const s=document.createElement("small"); s.textContent=(CATS[p.category]||[p.category,p.category,p.category])[IDX[lang]];
    const h=document.createElement("h3"); h.textContent=p.name;
    const f=document.createElement("div"); f.className="fab";
    f.textContent=t.fab+": "+((FABS[p.fabric]||[p.fabric,p.fabric,p.fabric])[IDX[lang]]);
    const d=document.createElement("p"); d.className="d"; d.textContent=p.description||"";
    const a=document.createElement("a"); a.className="ask"; a.textContent=t.ask; a.href=wa(t.p(p.name));
    info.append(s,h,f,d,a); c.append(ph,info); grid.append(c);
  });
}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{
  lang=b.dataset.l; try{localStorage.setItem("mannat-lang",lang)}catch(e){} paint();
});
$("year").textContent=new Date().getFullYear();

async function load(){
  const C=window.MANNAT||{};
  if(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&window.supabase){
    try{
      const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
      const {data,error}=await sb.from("products").select("*").order("sort").order("created_at",{ascending:false});
      if(!error&&data&&data.length)return data;
    }catch(e){}
  }
  return window.STARTER;
}
products=window.STARTER; paint();           // pehle turant dikhao
load().then(d=>{products=d;paint()});        // phir database se taaza list
