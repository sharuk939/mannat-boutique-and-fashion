<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mannat Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{padding-bottom:50px}
.box{background:#fff;border:1px solid var(--line);padding:22px;margin:24px auto;max-width:560px}
.box h2{font-family:var(--serif);color:var(--navy);font-size:1.6rem;margin-bottom:12px}
label{display:block;margin:12px 0 4px;font-weight:500;font-size:.95rem}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);background:#fff;border-radius:2px}
textarea{min-height:90px}
button.go{margin-top:16px;font:inherit;font-weight:500;padding:12px 22px;background:var(--navy);color:#fff;border:0;cursor:pointer;border-radius:2px}
button.go:disabled{opacity:.5}
button.sm{font:inherit;font-size:.88rem;padding:6px 12px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;margin-right:6px}
button.sm.del{border-color:var(--red);color:var(--red)}
.msg{margin-top:12px;padding:10px;font-size:.95rem}
.msg.err{background:#fdeaea;color:#8a1c1c}.msg.ok{background:#e8f6ec;color:#17602f}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row img{width:64px;height:84px;object-fit:cover}
.row b{font-family:var(--serif);font-size:1.15rem;color:var(--navy)}
.row small{color:var(--muted);display:block}
.top{display:flex;justify-content:space-between;align-items:center}
.prev{max-width:140px;margin-top:8px;display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap"><span class="brand"><span>Mannat Admin</span></span><button class="sm" id="out" hidden>Logout</button></div></header>
<div class="wrap">

<div class="box" id="setup" hidden><h2>Setup baaki hai</h2><p>config.js mein Supabase URL aur key abhi nahi bhari gayi hai. Chat mein diye gaye setup steps follow karein.</p></div>

<div class="box" id="login" hidden>
  <h2>Admin Login</h2>
  <form id="lf"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
  <button class="go" type="submit">Login</button></form>
  <div class="msg err" id="lm" hidden></div>
</div>

<div id="panel" hidden>
  <div class="box">
    <div class="top"><h2 id="ft">Naya product daalein</h2><button class="sm" id="cancel" hidden>Edit band karein</button></div>
    <form id="pf">
      <label for="file">Product ki photo</label><input id="file" type="file" accept="image/*">
      <img id="prev" class="prev" alt="">
      <label for="nm">Product ka naam</label><input id="nm" maxlength="80" required placeholder="jaise: Peach Kurta Set">
      <label for="ct">Category</label><select id="ct"></select>
      <label for="fb">Fabric</label><select id="fb"></select>
      <label for="ds">Chhota description</label><textarea id="ds" maxlength="300" placeholder="1-2 line: kaisa hai, kya khaas hai"></textarea>
      <button class="go" id="save" type="submit">Product save karein</button>
    </form>
    <div class="msg" id="pm" hidden></div>
  </div>
  <div class="box"><h2>Sabhi products</h2><div id="list"></div></div>
</div>
</div>

<script src="config.js"></script>
<script src="starter-products.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=id=>document.getElementById(id), C=window.MANNAT||{};
function note(el,txt,ok){el.textContent=txt;el.className="msg "+(ok?"ok":"err");el.hidden=false}
if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY||!window.supabase){$("setup").hidden=false}
else{
const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY), BUCKET="products";
let editing=null;
$("ct").innerHTML=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("");
$("fb").innerHTML=Object.entries(FABS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("");

async function show(){
  const {data}=await sb.auth.getSession();
  const on=!!data.session;
  $("login").hidden=on; $("panel").hidden=!on; $("out").hidden=!on;
  if(on)refresh();
}
$("lf").onsubmit=async e=>{
  e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error)note($("lm"),"Email ya password galat hai.",false);else{$("lm").hidden=true;show()}
};
$("out").onclick=async()=>{await sb.auth.signOut();show()};

function shrink(file){return new Promise((res,rej)=>{
  const img=new Image();
  img.onload=()=>{const r=Math.min(1,900/img.width),c=document.createElement("canvas");
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);
    c.toBlob(b=>b?res(b):rej(new Error("Photo process nahi hui")),"image/jpeg",.82)};
  img.onerror=()=>rej(new Error("Ye photo khul nahi paayi"));img.src=URL.createObjectURL(file)})}

$("file").onchange=()=>{const f=$("file").files[0],p=$("prev");if(f){p.src=URL.createObjectURL(f);p.style.display="block"}else p.style.display="none"};

function reset(){editing=null;$("pf").reset();$("prev").style.display="none";$("ft").textContent="Naya product daalein";$("cancel").hidden=true;$("save").textContent="Product save karein"}
$("cancel").onclick=reset;

$("pf").onsubmit=async e=>{
  e.preventDefault();
  const f=$("file").files[0];
  if(!f&&!editing)return note($("pm"),"Pehle product ki photo chunein.",false);
  $("save").disabled=true;note($("pm"),"Save ho raha hai...",true);
  try{
    const row={name:$("nm").value.trim(),category:$("ct").value,fabric:$("fb").value,description:$("ds").value.trim()};
    let oldPath=null;
    if(f){
      const path=`p/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
      const up=await sb.storage.from(BUCKET).upload(path,await shrink(f),{contentType:"image/jpeg"});
      if(up.error)throw up.error;
      row.image_url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;row.image_path=path;
      if(editing)oldPath=editing.image_path;
    }
    const r=editing?await sb.from("products").update(row).eq("id",editing.id):await sb.from("products").insert({...row,sort:0});
    if(r.error)throw r.error;
    if(oldPath)await sb.storage.from(BUCKET).remove([oldPath]);
    note($("pm"),editing?"Product update ho gaya.":"Product website par aa gaya.",true);
    reset();refresh();
  }catch(err){note($("pm"),"Kuch gadbad hui: "+(err.message||err)+". Agar login hai to check karein ki wahi admin email hai jo SQL mein daala tha.",false)}
  $("save").disabled=false;
};

async function refresh(){
  const {data,error}=await sb.from("products").select("*").order("sort").order("created_at",{ascending:false});
  const L=$("list");L.textContent="";
  if(error||!data)return;
  data.forEach(p=>{
    const r=document.createElement("div");r.className="row";
    const im=document.createElement("img");im.src=p.image_url;im.alt="";
    const t=document.createElement("div");t.style.flex="1";
    const b=document.createElement("b");b.textContent=p.name;
    const s=document.createElement("small");s.textContent=(CATS[p.category]||[p.category])[0]+" | "+(FABS[p.fabric]||[p.fabric])[0];
    const ed=document.createElement("button");ed.className="sm";ed.textContent="Edit";
    ed.onclick=()=>{editing=p;$("nm").value=p.name;$("ct").value=p.category;$("fb").value=p.fabric;$("ds").value=p.description||"";
      $("ft").textContent="Product edit karein (nayi photo optional hai)";$("save").textContent="Update karein";$("cancel").hidden=false;scrollTo(0,0)};
    const del=document.createElement("button");del.className="sm del";del.textContent="Delete";
    del.onclick=async()=>{
      if(!confirm('"'+p.name+'" delete karna hai?'))return;
      const d=await sb.from("products").delete().eq("id",p.id);
      if(d.error)return note($("pm"),"Delete nahi hua: "+d.error.message,false);
      if(p.image_path)await sb.storage.from(BUCKET).remove([p.image_path]);
      refresh();
    };
    const bx=document.createElement("div");bx.style.marginTop="6px";bx.append(ed,del);
    t.append(b,s,bx);r.append(im,t);L.append(r);
  });
}
show();
}
</script>
</body>
</html>
